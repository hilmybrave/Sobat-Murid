<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#031a19">
<meta name="description" content="SOBAT MURID – ruang aman bercerita untuk murid madrasah.">
<title>SOBAT MURID – Madrasah Modern</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* ===== Tema: deep teal + metallic gold ===== */
:root{
  --bg:#031a19; --ink:#eef6f1; --mute:#a3c2b9;
  --gold:#d9b35a; --gold-hi:#f4e0a3; --gold-lo:#a98230;
  --em:#1fae8a; --em-lo:#0e6f5c;
  --danger:#e8786f;
  --g:rgba(255,255,255,.07); --gb:rgba(217,179,90,.24);
}
*{box-sizing:border-box;margin:0}
body{font:15px/1.6 'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh;overflow-x:hidden;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
h1,h2,h3{font-family:Amiri,Georgia,serif;line-height:1.2}
h4{font-size:14px;font-weight:700;color:var(--gold);margin:14px 0 6px}
#scene{position:fixed;inset:0;z-index:-1}#scene svg{width:100%;height:100%;display:block}
.glass{background:var(--g);border:1px solid var(--gb);border-radius:22px;backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);box-shadow:0 20px 50px -20px rgba(0,0,0,.6)}
.wrap{max-width:1080px;margin:0 auto;padding:0 14px 40px}

/* Header & logo */
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:14px 0}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;background:none;border:0;color:inherit;font:inherit;text-align:left}
.app-logo{display:block;object-fit:contain}
.app-logo.gone{display:none}
#app-logo{width:46px;height:46px}
.hero-logo{width:min(44vw,150px);height:auto;margin:0 auto 12px;filter:drop-shadow(0 8px 22px rgba(217,179,90,.3))}
.brand b{font:700 21px Amiri,serif;display:block;line-height:1;color:var(--gold-hi)}.brand small{color:var(--mute);font-size:11px}

/* Tombol */
.btn{font-weight:700;font-size:14px;font-family:inherit;border:0;border-radius:14px;padding:11px 18px;cursor:pointer;color:#052321;background:linear-gradient(135deg,var(--gold-hi),var(--gold) 55%,var(--gold-lo));transition:transform .25s,opacity .25s;box-shadow:0 8px 20px -8px rgba(217,179,90,.6)}
.btn:hover:not(:disabled){transform:translateY(-2px)}.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.gh{background:var(--g);color:var(--ink);border:1px solid var(--gb);box-shadow:none}
.btn.em{background:linear-gradient(135deg,#46d6ad,var(--em) 60%,var(--em-lo));color:#032620}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:11px}
.btn.dn{background:linear-gradient(135deg,#f6a39b,var(--danger));color:#2a0b08}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
[role=dialog]:focus{outline:none}

main.in{animation:in .5s cubic-bezier(.2,.8,.2,1)}@keyframes in{from{opacity:0;transform:translateY(12px)}}
.card{padding:22px;margin-bottom:14px}.hero{padding:30px 22px;text-align:center;max-width:560px;margin:3vh auto 0}
.ar{font:700 32px Amiri,serif;color:var(--gold)}
h2{font-size:27px;margin:6px 0}h3{font-size:21px;margin-bottom:8px;color:var(--gold)}
p.mu,.mu{color:var(--mute)}
label{display:block;font-weight:700;font-size:13px;margin:12px 0 6px;text-align:left}
select,input,textarea{width:100%;padding:11px 13px;border-radius:13px;border:1px solid var(--gb);background:rgba(3,26,24,.65);color:var(--ink);font:inherit}
textarea{min-height:90px;resize:vertical}select option{color:#052321}

/* Pilihan mood */
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));margin:10px 0}
.opt{padding:12px 6px;border-radius:16px;border:1.5px solid var(--gb);background:var(--g);color:var(--ink);font-weight:600;font-size:14px;font-family:inherit;cursor:pointer;transition:all .3s}
.opt span{display:block;font-size:28px}.opt:hover{transform:translateY(-3px)}
.opt.on{border-color:var(--gold);background:rgba(217,179,90,.22);box-shadow:0 0 0 3px rgba(217,179,90,.25)}
.two{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}
.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:14px}
.stat{padding:14px}.stat b{font:700 28px Amiri,serif;color:var(--gold);display:block}

/* Tab Wali Kelas */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 12px}.tabs .btn{white-space:nowrap}
.cnt{display:inline-block;min-width:20px;margin-left:6px;padding:0 6px;border-radius:99px;background:var(--danger);color:#2a0b08;font-size:11px;font-weight:800;line-height:18px;text-align:center}

ul.l{list-style:none;padding:0}ul.l li{display:flex;align-items:center;gap:6px;padding:7px 0;border-bottom:1px solid var(--gb)}ul.l li span{flex:1;overflow-wrap:anywhere}
.ib{border:0;background:none;color:var(--ink);cursor:pointer;font-size:16px;padding:4px 8px;border-radius:8px}.ib:hover{background:var(--g)}
.add{display:flex;gap:8px;margin-top:10px}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{padding:5px 12px;border-radius:99px;background:rgba(31,174,138,.16);border:1px solid rgba(31,174,138,.45);font-size:13px;color:inherit;font-family:inherit;cursor:pointer}
.chip.urg-mendesak{background:rgba(232,120,111,.14);border-color:rgba(232,120,111,.6)}
.chip.on{background:rgba(217,179,90,.3);border-color:var(--gold)}
.ann{padding:12px 14px;border-left:4px solid var(--gold);background:rgba(217,179,90,.1);border-radius:0 12px 12px 0;margin:8px 0}
.alert{border-color:rgba(232,120,111,.6);display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}

/* Grafik */
.bars{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;height:190px;margin:12px 0 6px}
.col{display:grid;grid-template-rows:1fr auto;text-align:center;font-size:11px;color:var(--mute);min-width:0}.sw{display:flex;align-items:flex-end;justify-content:center}
.stack{width:60%;max-width:44px;display:flex;flex-direction:column-reverse;border-radius:9px;overflow:hidden;transition:height .6s}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mute)}.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.row{display:grid;grid-template-columns:120px 1fr 36px;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.pb{height:10px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden;margin:8px 0}.pb i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--em),var(--gold));transition:width .3s}

/* Tabel riwayat */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:640px}
.rt{min-width:880px}
th,td{padding:9px 10px;border-bottom:1px solid var(--gb);text-align:left;vertical-align:top}
th{color:var(--gold-hi);background:rgba(217,179,90,.12);border-bottom:2px solid var(--gold);font-weight:700;white-space:nowrap}
tr.crit td:first-child{box-shadow:inset 4px 0 0 var(--danger)}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;max-width:220px}
.acts{display:flex;gap:6px;white-space:nowrap}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--gold);padding:0}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar input{flex:2;min-width:200px;width:auto}.bar select{flex:1;min-width:150px;width:auto}

/* Badge urgensi */
.ug{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:99px;font-weight:700;font-size:12px;line-height:1.4;border:1px solid;white-space:nowrap}
.ug::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.ug-rendah{color:#6fe0bd;background:rgba(31,174,138,.15);border-color:rgba(31,174,138,.5)}
.ug-sedang{color:var(--gold-hi);background:rgba(217,179,90,.18);border-color:var(--gold)}
.ug-mendesak{color:#2a0b08;background:linear-gradient(135deg,#f6a39b,var(--danger));border-color:var(--gold);box-shadow:0 0 0 2px rgba(217,179,90,.35)}

/* Chat */
.chat{display:flex;flex-direction:column;height:min(66vh,620px)}#msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.m{max-width:86%;padding:10px 14px;border-radius:18px;animation:in .35s;overflow-wrap:anywhere}
.m.b{background:rgba(31,174,138,.18);border:1px solid rgba(31,174,138,.38);border-bottom-left-radius:5px;align-self:flex-start}
.m.u{background:rgba(217,179,90,.22);border:1px solid rgba(217,179,90,.42);border-bottom-right-radius:5px;align-self:flex-end}
form.cf{display:flex;gap:8px;padding:12px;border-top:1px solid var(--gb)}

/* Game */
.stage{max-width:380px;margin:8px auto;text-align:center}.plant{width:100%;display:block}
#can{font-size:56px;display:inline-block;transition:transform .4s;user-select:none}.pour #can{transform:rotate(-25deg)}

/* Modal */
.ov{position:fixed;inset:0;z-index:50;display:flex;padding:16px;overflow-y:auto;background:rgba(2,18,16,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);animation:fade .3s}
@keyframes fade{from{opacity:0}}
.ov .glass{width:100%;max-width:400px;margin:auto;padding:26px;background:rgba(10,50,45,.82);animation:in .4s;text-align:center}
.ov .glass.wide{max-width:640px;text-align:left}
.dh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:10px}
.tr{display:flex;flex-direction:column;gap:8px;max-height:min(42vh,380px);overflow-y:auto;padding:12px;border:1px solid var(--gb);border-radius:16px;background:rgba(0,0,0,.2)}
.tr .m small{display:block;font-size:11px;opacity:.7;margin-bottom:2px}
.dctl{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin:12px 0}.dctl>label{flex:1;min-width:180px;margin:0}
.chk{display:flex;align-items:center;gap:8px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}

.err{color:#ffb4b4;font-size:13px;min-height:20px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,30px);opacity:0;padding:11px 20px;border-radius:99px;z-index:60;pointer-events:none;transition:all .4s;background:rgba(4,32,29,.96);border:1px solid var(--gold);max-width:92vw;text-align:center}#toast.on{opacity:1;transform:translate(-50%,0)}
.empty{text-align:center;padding:22px;color:var(--mute)}
/* ===== Loader futuristik: orbit dual-ring + shimmer glass ===== */
.ldr{display:flex;flex-direction:column;align-items:center;gap:14px;padding:10px 0}
.orb{position:relative;width:92px;height:92px;display:grid;place-items:center}
.orb .r{position:absolute;inset:0;border-radius:50%;border:2px solid transparent}
.orb .r1{border-top-color:var(--gold-hi);border-right-color:var(--gold);animation:orb 1.4s cubic-bezier(.6,.1,.4,.9) infinite;filter:drop-shadow(0 0 8px rgba(217,179,90,.8))}
.orb .r2{inset:12px;border-bottom-color:var(--em);border-left-color:#46d6ad;animation:orb 1.9s linear infinite reverse;filter:drop-shadow(0 0 8px rgba(31,174,138,.8))}
.orb .r3{inset:24px;border:1px dashed rgba(217,179,90,.5);animation:orb 6s linear infinite}
.orb .dot{position:absolute;inset:0;animation:orb 2.6s linear infinite}
.orb .dot::after{content:"";position:absolute;top:-4px;left:50%;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--gold-hi);box-shadow:0 0 12px 3px rgba(244,224,163,.8)}
.orb .core{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle,var(--gold-hi),var(--gold) 60%,var(--gold-lo));animation:core 1.8s ease-in-out infinite}
@keyframes orb{to{transform:rotate(360deg)}}
@keyframes core{0%,100%{transform:scale(.8);box-shadow:0 0 10px 2px rgba(217,179,90,.5)}50%{transform:scale(1.15);box-shadow:0 0 26px 8px rgba(217,179,90,.75)}}
.ldr-t{font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--gold-hi);animation:blink 1.8s ease-in-out infinite}
.ldr-t .d{display:inline-block;animation:blink 1.2s infinite}.ldr-t .d:nth-child(2){animation-delay:.2s}.ldr-t .d:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}
.ldr-bar{width:min(220px,70%);height:3px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden}
.ldr-bar::after{content:"";display:block;height:100%;width:40%;background:linear-gradient(90deg,transparent,var(--gold-hi),transparent);animation:slide 1.4s ease-in-out infinite}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
.shim{position:relative;overflow:hidden}
.shim::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(110deg,transparent 30%,rgba(244,224,163,.10) 50%,transparent 70%);transform:translateX(-100%);animation:sweep 2.4s ease-in-out infinite}
@keyframes sweep{to{transform:translateX(100%)}}
.ldr.sm{flex-direction:row;justify-content:center;gap:12px;padding:6px 0}.ldr.sm .orb{width:36px;height:36px}.ldr.sm .orb .r2{inset:6px}.ldr.sm .orb .r3,.ldr.sm .ldr-bar{display:none}.ldr.sm .core{width:8px;height:8px}.ldr.sm .orb .dot::after{width:5px;height:5px;margin-left:-2.5px;top:-2px}
.skel{height:12px;border-radius:8px;background:linear-gradient(90deg,rgba(255,255,255,.06),rgba(244,224,163,.18),rgba(255,255,255,.06));background-size:200% 100%;animation:skl 1.4s linear infinite}@keyframes skl{to{background-position:-200% 0}}

/* ===== Progres hapalan ===== */
.haf-top{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.ring{--p:0;width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--gold) calc(var(--p)*1%),rgba(255,255,255,.1) 0);position:relative;flex:none;box-shadow:0 0 22px -4px rgba(217,179,90,.5)}
.ring::before{content:"";position:absolute;inset:9px;border-radius:50%;background:#06312d}
.ring b{position:relative;font:700 24px Amiri,serif;color:var(--gold-hi)}
.haf-info{flex:1;min-width:180px}.haf-info .big{font:700 22px Amiri,serif;color:var(--gold-hi);overflow-wrap:anywhere}
.haf-grid{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));margin-top:14px}
.haf-it{padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--gb)}
.haf-it small{display:block;color:var(--mute);font-size:11px}.haf-it b{font-size:15px;color:var(--gold-hi);overflow-wrap:anywhere}

/* ===== Roster sepekan ===== */
.card.clk{cursor:pointer;transition:transform .25s,border-color .25s}.card.clk:hover{transform:translateY(-2px);border-color:var(--gold)}
.hint{display:inline-block;margin-top:10px;font-size:12px;font-weight:700;color:var(--gold-hi)}
.wk{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));max-height:min(60vh,520px);overflow-y:auto;padding:4px}
.wd{padding:12px 14px;border-radius:16px;border:1px solid var(--gb);background:rgba(255,255,255,.04)}
.wd h4{margin:0 0 6px;font-size:15px}
.wd.now{border-color:var(--gold);background:rgba(217,179,90,.16);box-shadow:0 0 0 3px rgba(217,179,90,.25)}.wd.now h4{color:var(--gold-hi)}
.tag{display:inline-block;margin-left:8px;padding:1px 9px;border-radius:99px;background:var(--gold);color:#052321;font:800 11px 'Plus Jakarta Sans',sans-serif;vertical-align:middle}
.wd ul{list-style:none;padding:0}.wd li{padding:4px 0;border-bottom:1px dashed var(--gb);font-size:14px;overflow-wrap:anywhere}.wd li:last-child{border:0}
code{background:rgba(0,0,0,.3);padding:1px 6px;border-radius:6px;font-size:13px}

#rpt{display:none}
@media print{body>*:not(#rpt){display:none!important}#rpt{display:block;color:#000;background:#fff;padding:24px;font-family:sans-serif}#rpt table{min-width:0}#rpt td,#rpt th{border:1px solid #888;color:#000;background:none}}
@media(max-width:560px){.row{grid-template-columns:96px 1fr 32px}h2{font-size:23px}.card{padding:16px}.m{max-width:94%}#app-logo{width:40px;height:40px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

'use strict';

/* =====================================================================

   ===================================================================== */
const CONFIG = {

  TIMEOUT_MS: 25000,

const $ = s => document.querySelector(s);

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

  {k:'Cerah',e:'☀️',c:'#f2c94c'}, {k:'Berawan',e:'⛅',c:'#9bb8d3'}, {k:'Hujan',e:'🌧️',c:'#4f86e0'},

];
const FB = {

const gasReady = () => /^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec/.test(CONFIG.GAS_URL);

/* Apps Script tidak mendukung preflight OPTIONS. Karena itu POST dikirim sebagai
   "simple request" (Content-Type: text/plain) dengan isi JSON; server mem-parse sendiri. */
async function api(action, payload = {}, opt = {}) {
  if (!gasReady()) throw new Error('URL Google Apps Script belum diisi.');
  const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), opt.timeout || CONFIG.TIMEOUT_MS);
  try {
    let res;
    if (opt.get) {
      const qs = new URLSearchParams({action, _: Date.now(), ...payload});
      res = await fetch(`${CONFIG.GAS_URL}?${qs}`, {method:'GET', mode:'cors', redirect:'follow', signal:ctl.signal});
    } else {
      const data = {action, ...payload};
      if (opt.teacher) data.token = S.token;
      const body = JSON.stringify(data);
      res = await fetch(CONFIG.GAS_URL, {method:'POST', mode:'cors', redirect:'follow', headers:{'Content-Type':'text/plain;charset=utf-8'}, body, signal:ctl.signal});
    }
    const txt = await res.text();
    let j;
    try { j = JSON.parse(txt); } catch (e) { throw new Error('Respons server tidak valid. Pastikan Web App di-deploy dengan akses "Anyone".'); }
    if (!j.ok) {
      if (j.error === 'UNAUTHORIZED') { if (S.unlocked) lockTeacher('Sesi berakhir. Silakan masuk lagi.'); throw new Error('Tidak diizinkan'); }
      throw new Error(j.error || 'Terjadi kesalahan');
    }
    return j.data;
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('Waktu tunggu habis');
    if (e instanceof TypeError) throw new Error('Tidak dapat terhubung ke server');
    throw e;
  } finally { clearTimeout(to); }
}

function actx() { if (!ac) try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} if (ac && ac.state === 'suspended') ac.resume(); return ac; }
function splash() {
  if (S.mute) return; const c = actx(); if (!c) return;
  const n = c.sampleRate * .12, b = c.createBuffer(1, n, c.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = c.createBufferSource(); s.buffer = b;
  const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1400;
  const g = c.createGain(); g.gain.value = .07;
  s.connect(f); f.connect(g); g.connect(c.destination); s.start();
}
function chime() {
  if (S.mute) return; const c = actx(); if (!c) return;
  [523, 659, 784, 1047].forEach((f, i) => {
    const o = c.createOscillator(), g = c.createGain(), t = c.currentTime + i * .18;
    o.frequency.value = f;
    g.gain.setValueAtTime(.001, t); g.gain.exponentialRampToValueAtTime(.12, t + .05); g.gain.exponentialRampToValueAtTime(.001, t + 1.2);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + 1.3);
  });
}
function startAmb() {
  if (S.mute || amb) return; const c = actx(); if (!c) return;
  const g = c.createGain(); g.gain.value = .025; g.connect(c.destination);
  const os = [196, 246.9, 293.7].map(f => { const o = c.createOscillator(); o.type = 'sine'; o.frequency.value = f; o.connect(g); o.start(); return o; });
  amb = {os, g};
}
function stopAmb() { if (!amb) return; amb.os.forEach(o => { try { o.stop(); } catch (e) {} }); amb = null; }
function tick() {
  if (S.mute) return; const c = actx(); if (!c) return;
  const t = c.currentTime, o = c.createOscillator(), g = c.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(880, t); o.frequency.exponentialRampToValueAtTime(520, t + .08);
  g.gain.setValueAtTime(.001, t); g.gain.exponentialRampToValueAtTime(.06, t + .01); g.gain.exponentialRampToValueAtTime(.001, t + .12);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + .14);
}
const TTS = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
let VO = null;
function pickVoice() {
  if (!TTS) return;
  const vs = speechSynthesis.getVoices().filter(v => /^id/i.test(String(v.lang).replace('_', '-')));
  if (!vs.length) { VO = null; return; }
  const sc = v => (/natural|online/i.test(v.name)?4:0) + (/google|microsoft/i.test(v.name)?2:0) + (/gadis|ardi|damayanti/i.test(v.name)?1:0) + (v.localService?0:1);
  VO = vs.sort((a, b) => sc(b) - sc(a))[0];
}
if (TTS) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(t) {
  if (!TTS || S.mute) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t); u.lang = 'id-ID'; if (VO) u.voice = VO; u.rate = .92; u.pitch = 1; u.onstart = () => { wel = false; };
    setTimeout(() => { try { speechSynthesis.speak(u); } catch (e) {} }, 60);

}

const nk = s => String(s == null ? '' : s).toLowerCase().replace(/[^a-z0-9]/g, '');

const dtxt = v => { if (v === '') return ''; const s = String(v), d = new Date(s); return /\d{4}|\d{1,2}[\/-]\d{1,2}/.test(s) && !isNaN(d) && d.getFullYear() > 2000 ? d.toLocaleDateString('id-ID', {day:'numeric', month:'long', year:'numeric'}) : s; };

const HK = {

};
function normRow(x) { const o = {}, L = {}; Object.keys(x).forEach(k => { o[nk(k)] = x[k]; L[nk(k)] = String(k); }); o.__L = L; return o; }
function hafRows(j) {
  if (Array.isArray(j)) {
    if (j.length && Array.isArray(j[0])) { const h = j[0].map(String); return j.slice(1).map(r => { const o = {}; h.forEach((k, i) => { if (k) o[k] = r[i]; }); return normRow(o); }); }
    return j.filter(x => x && typeof x === 'object' && !Array.isArray(x)).map(normRow);
  }
  if (j && typeof j === 'object') {
    if (HK.name.some(k => Object.keys(j).some(x => nk(x) === k))) return [normRow(j)];
    const pref = ['data','rows','result','hasil','items','records','values','murid','hapalan','hafalan'];
    for (const k of [...pref, ...Object.keys(j).filter(k => !pref.includes(k))]) {
      if (j[k] && typeof j[k] === 'object') { const r = hafRows(j[k]); if (r.length) return r; }

  try { h = await sha($('#pw').value); } catch (x) { e.textContent = 'Peramban tidak mendukung enkripsi. Buka lewat HTTPS.'; return; }
  e.textContent = 'Memeriksa…';
  try {
    await api('verify', {token:h});
    S.unlocked = true; S.token = h; S.tries = 0; modal(''); S.tab = 'ringkas'; go('guru'); loadLogs();
  } catch (x) {
    if (x.message === 'Tidak diizinkan') { if (++S.tries >= 5) { S.until = Date.now() + 30000; S.tries = 0; } e.textContent = 'Kata sandi salah.'; }
    else e.textContent = x.message;
  }
}
function lockTeacher(msg) { S.unlocked = false; S.token = ''; S.logs = []; modal(''); if (msg) toast(msg); go('login'); }

/* ---- Riwayat: muat, baca, ubah, hapus ---- */
async function loadLogs() {
  S.logsLoading = true; if (S.view === 'guru') render();
  try { const r = await api('getLogs', {}, {teacher:true}); S.logs = Array.isArray(r) ? r.slice().sort((a, b) => tv(b) - tv(a)) : r; }
  catch (e) { if (S.unlocked) toast('Gagal memuat riwayat: ' + e.message); }
  S.logsLoading = false; if (S.view === 'guru') render();
}
function openLog(id) {
  const l = S.logs.find(x => x.id === id); if (!l) return;
  const chat = l.chat || [];
  modal(`<div class="dh"><div><h3 style="margin:0">${esc(l.name)} ${esc(l.title)}</h3><div class="mu" style="font-size:13px">${fmt(l.t)}</div></div><span id="dbadge">${badge(urgOf(l))}</span></div>
    <div class="chips"><span class="chip">${wOf(l.w).e} ${esc(l.w)}</span><span class="chip">${esc(l.g)}</span></div>
    ${l.m ? `<div class="ann"><b>Catatan murid:</b> ${esc(l.m)}</div>` : ''}
    <h4>Percakapan</h4>
    <div class="tr" tabindex="0" aria-label="Riwayat percakapan">${chat.length ? chat.map(x => `<div class="m ${x.r === 'u' ? 'u' : 'b'}"><small>${x.r === 'u' ? esc(l.name) : 'SOBAT MURID'}</small>${esc(x.t)}</div>`).join('') : '<div class="empty">Murid belum bercerita lewat chat.</div>'}</div>
    <div class="dctl"><label>Tingkat urgensi<select data-c="urgsel" data-id="${l.id}">${opts([['rendah','Rendah'],['sedang','Sedang'],['mendesak','Mendesak']], urgOf(l))}</select></label>
    <label class="chk"><input type="checkbox" data-c="done" data-id="${l.id}" ${l.done ? 'checked' : ''}> Sudah ditindaki</label></div>
    <div class="mfoot"><button class="btn dn" data-a="dellog" data-id="${l.id}">🗑️ Hapus</button><button class="btn" data-a="close">Tutup</button></div>`, true);
}
async function setLog(id, patch) {
  const l = S.logs.find(x => x.id === id); if (!l) return;
  const old = {}; Object.keys(patch).forEach(k => old[k] = l[k]);
  const paint = () => { render(); const b = $('#dbadge'); if (b) b.innerHTML = badge(urgOf(l)); };
  Object.assign(l, patch); paint();
  try { await api('updateLog', {id, patch}, {teacher:true}); toast('Perubahan tersimpan'); }
  catch (e) { Object.assign(l, old); paint(); toast('Gagal menyimpan: ' + e.message); }
}
function askDelLog(id) {
  const l = S.logs.find(x => x.id === id); if (!l) return;
  cfm('Hapus riwayat ini?', async () => {
    try {
      toast('Menghapus…');
      await api('deleteLog', {id}, {teacher:true});
      S.logs = S.logs.filter(x => x.id !== id); render(); toast('Riwayat dihapus');
    } catch (e) { toast('Gagal menghapus: ' + e.message); }
  }, `Riwayat ${esc(l.name)} ${esc(l.title)} (${fmt(l.t)}) beserta seluruh percakapannya akan dihapus permanen dari Google Sheets.`);
}

/* =====================================================================
   7. GAME PENYIRAMAN TANAMAN
   ===================================================================== */
function paintPlant() {
  const p = S.p, h = Math.round(p * 1.1), y = 182 - h, g = $('#ps'); if (!g) return;
  g.innerHTML = `<path d="M100 182V${y}" stroke="#2fa36b" stroke-width="6" stroke-linecap="round" fill="none"/>${p > 25 ? `<ellipse cx="82" cy="${182 - h * .45}" rx="18" ry="8" fill="#3fc080" transform="rotate(-25 82 ${182 - h * .45})"/>` : ''}${p > 50 ? `<ellipse cx="118" cy="${182 - h * .65}" rx="18" ry="8" fill="#3fc080" transform="rotate(25 118 ${182 - h * .65})"/>` : ''}${p >= 100 ? `<g transform="translate(100 ${y})">${[0,72,144,216,288].map(a => `<ellipse cy="-14" rx="8" ry="14" fill="#f4e0a3" transform="rotate(${a})"/>`).join('')}<circle r="8" fill="#d9b35a"/></g>` : p > 75 ? `<circle cx="100" cy="${y}" r="7" fill="#9bd8b6"/>` : ''}`;
  $('#pbar').style.width = p + '%';
  $('#pt').textContent = p >= 100 ? 'MasyaAllah, tanamanmu mekar indah! 🌸' : p > 50 ? 'Terus, tanamanmu semakin tinggi...' : 'Siramlah dengan lembut...';
}
function water() { if (S.p >= 100) { stopWater(); return; } S.p = Math.min(100, S.p + 2); splash(); paintPlant(); if (S.p >= 100) { stopWater(); chime(); toast('Tanamanmu mekar! 🌸'); } }
function startWater() { if (hold || S.p >= 100) return; actx(); water(); hold = setInterval(water, 110); const s = $('#canw'); if (s) s.classList.add('pour'); }
function stopWater() { clearInterval(hold); hold = null; const s = $('#canw'); if (s) s.classList.remove('pour'); }

/* =====================================================================
   8. JURNAL & CHAT MURID
   ===================================================================== */
async function saveJournal() {
  const m = S.mood;
  if (!m.w || (!m.g && !m.m.trim())) return toast('Pilih Cuaca Hati dan Pemicu atau tulis penyebabnya ya.');
  const log = {id:uid(), t:Date.now(), name:S.me.name, title:S.me.title, w:m.w, g:m.g || 'Tulisan sendiri', m:m.m.trim(), done:false, urgency:scoreUrgency(m.w, m.m, [])};
  S.saving = true; render();
  try {
    await api('saveLog', {log});
    S.logId = log.id; S.saved = true; S.msgs = []; S.p = 0;
    toast('Jurnal tersimpan. Jazakumullah khairan! 🌟');
  } catch (e) { toast('Jurnal belum tersimpan: ' + e.message); }
  S.saving = false; render();
}

function paintMsgs() {
  const m = $('#msgs'); if (!m) return;
  m.innerHTML = S.msgs.map(x => `<div class="m ${x.r}">${esc(x.t)}</div>`).join('') + (S.busy ? '<div class="m b">… menulis</div>' : '');
  m.scrollTop = m.scrollHeight;
}
function startChat() {
  const m = S.mood;
  if (!S.msgs.length) S.msgs = [{r:'b', t:`Assalamu’alaikum, ${S.me.name} ${S.me.title}! 🌿 Hari ini cuaca hatimu ${m.w.toLowerCase()}${m.g ? `, dipicu oleh ${m.g.toLowerCase()}` : ''}${m.m ? ` ("${m.m}")` : ''}. Ceritakan apa yang kamu rasakan ya, aku siap mendengarkan.`}];
  go('chat');
}
const fallback = mood => `${FB[mood.w]} ${mood.g ? `Soal ${mood.g.toLowerCase()}, bagian mana yang paling kamu rasakan?` : 'Bagian mana yang paling kamu rasakan?'} Kalau terasa berat, kamu boleh cerita juga ke Wali Kelas. 🌿`;

/* AI dipanggil lewat Apps Script; model default & API Key dikelola di server */
const aiReply = arr => api('chat', {name:S.me.name, title:S.me.title, mood:S.mood, msgs:arr.slice(1).map(({r, t}) => ({r, t}))}, {timeout:CONFIG.CHAT_TIMEOUT_MS}).then(d => d.text);

/* Simpan transkrip chat + urgensi ke Google Sheets (latar belakang) */
function syncChat(id, arr, mood) {
  if (!id) return;
  const urgency = scoreUrgency(mood.w, mood.m, arr.filter(x => x.r === 'u').map(x => x.t));
  api('saveChat', {id, msgs:arr.map(({r, t}) => ({r, t})), urgency}).catch(() => {
    if (!syncChat.w) { syncChat.w = 1; toast('Percakapan belum tersimpan ke server.'); }
  });
}
async function send() {
  const i = $('#ci'), t = i.value.trim(); if (!t || S.busy) return;
  const arr = S.msgs, id = S.logId, mood = {...S.mood};
  i.value = ''; arr.push({r:'u', t}); S.busy = true; paintMsgs();
  let rep;
  if (D.hasKey) {
    try { rep = await aiReply(arr); }
    catch (e) { rep = fallback(mood); if (e.message !== 'NO_KEY') toast('AI belum terhubung. Memakai balasan sederhana.'); }
  } else { await new Promise(r => setTimeout(r, 700)); rep = fallback(mood); }
  if (RX_CRIT.test(t)) rep += ' Aku peduli padamu. Tolong segera ceritakan hal ini kepada Wali Kelas atau orang dewasa yang kamu percaya ya. 💛';
  arr.push({r:'b', t:rep}); S.busy = false;
  if (S.msgs === arr && S.view === 'chat') paintMsgs();
  syncChat(id, arr, mood);
}
function endChat(to) {
  const said = S.msgs.some(x => x.r === 'u');
  const fin = () => {
    modal(''); S.msgs = [];
    if (to === 'out') { S.me = null; S.mood = {w:null, g:null, m:''}; S.saved = false; S.logId = null; S.p = 0; go('login'); } else go('dash');
  };
  if (!said) { fin(); return; }
  cb = fin; speak('Terima kasih ceritanya. Pak Hilmy akan berusaha membuatmu bahagia selalu.');
  modal(`<div style="font-size:44px">💛</div><h3>Terima kasih ceritanya</h3><p class="mu" style="margin:10px 0 18px">Pak Hilmy akan berusaha membuatmu bahagia selalu.</p><button class="btn em" style="width:100%" data-a="yes">${to === 'out' ? 'Keluar' : 'Kembali ke Dashboard'}</button>`);
}

/* =====================================================================
   9. EKSPOR LAPORAN
   ===================================================================== */
function xls() {
  const q = s => { let v = String(s == null ? '' : s); if (/^[=+\-@]/.test(v)) v = "'" + v; return `"${v.replace(/"/g, '""')}"`; };
  const rows = [['Laporan Jurnal Emosi Murid'], ['Dicetak', fmt(Date.now())], [], ['Tanggal','Nama','Gelar Rahasia','Urgensi','Cuaca Hati','Pemicu','Catatan Manual','Jumlah Pesan Chat','Status'],
    ...fl().map(l => [fmt(l.t), l.name, l.title, URG[urgOf(l)].l, l.w, l.g, l.m, (l.chat || []).length, l.done ? 'Sudah Ditindaki' : 'Belum Ditindaki'])];
  const b = new Blob(['\ufeff' + rows.map(r => r.map(q).join(',')).join('\r\n')], {type:'text/csv;charset=utf-8'}), a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = 'laporan_murid.csv'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000); toast('Laporan Excel (CSV) diunduh');
}
function pdf() {
  const L = fl();
  $('#rpt').innerHTML = `<h1>Laporan Jurnal Emosi Murid</h1><p>Dicetak ${fmt(Date.now())} • Total: ${L.length} data</p><table><tr><th>Tanggal</th><th>Murid</th><th>Urgensi</th><th>Cuaca</th><th>Pemicu</th><th>Catatan</th><th>Status</th></tr>${L.map(l => `<tr><td>${fmt(l.t)}</td><td>${esc(l.name)} ${esc(l.title)}</td><td>${URG[urgOf(l)].l}</td><td>${esc(l.w)}</td><td>${esc(l.g)}</td><td>${esc(l.m)}</td><td>${l.done ? 'Sudah' : 'Belum'}</td></tr>`).join('')}</table>`;
  window.print();
}
addEventListener('afterprint', () => { $('#rpt').innerHTML = ''; });

/* =====================================================================
   10. EVENT HANDLER
   ===================================================================== */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const a = el.dataset.a, k = el.dataset.k, i = +el.dataset.i;
  if (a === 'ovc') { if (e.target === el) modal(''); return; }
  if (a === 'close') modal('');
  else if (a === 'yes') { const f = cb; cb = null; modal(''); if (f) f(); }
  else if (a === 'go') go(el.dataset.v);
  else if (a === 'retry') boot();
  else if (a === 'roster') openRoster();
  else if (a === 'hafretry') loadHaf(true);
  else if (a === 'tlogin') S.unlocked ? go('guru') : tlogin();
  else if (a === 'mute') { S.mute = !S.mute; if (S.mute) { stopAmb(); if (TTS) speechSynthesis.cancel(); } render(); }
  else if (a === 'endchat') endChat(k);
  else if (a === 'lock') lockTeacher();
  else if (a === 'out') { S.me = null; S.mood = {w:null, g:null, m:''}; S.saved = false; S.logId = null; S.msgs = []; S.p = 0; go('login'); }
  else if (a === 'mw') { S.mood.w = k; S.saved = false; render(); }
  else if (a === 'mg') { S.mood.g = k; S.saved = false; render(); }
  else if (a === 'savej') saveJournal();
  else if (a === 'chatgo') startChat();
  else if (a === 'water') { /* ditangani pointer events */ }
  else if (a === 'tab') { S.tab = k; render(); }
  else if (a === 'reload') loadLogs();
  else if (a === 'urg') { S.urg = k; render(); }
  else if (a === 'critgo') { S.tab = 'riwayat'; S.urg = 'mendesak'; S.flt = 'open'; render(); }
  else if (a === 'view') openLog(el.dataset.id);
  else if (a === 'dellog') askDelLog(el.dataset.id);
  else if (a === 'bulk') {
    const mode = $('#bm').value, raw = $('#bt').value.split('\n').map(s => s.trim()).filter(Boolean);
    let n = 0, t = 0;
    const addU = (arr, v) => { v = v.trim(); if (v && !arr.includes(v)) { arr.push(v); return 1; } return 0; };
    raw.forEach(line => {
      if (mode === 'p') { const [x, ...y] = line.split(/[,;|]/); n += addU(D.names, x || ''); t += addU(D.titles, y.join(',') || ''); }
      else line.split(',').forEach(x => { if (mode === 'n') n += addU(D.names, x); else t += addU(D.titles, x); });
    });
    save(`Ditambahkan: ${n} Nama, ${t} Gelar`); render();
  }
  else if (a === 'ed') {
    const old = D[k][i];
    ask('Edit data', old, v => {
      v = v.trim(); if (!v) return;
      if (D[k].some((x, j) => x === v && j !== i)) return toast('Data sudah ada.');
      D[k][i] = v;
      if (k === 'names') Object.keys(D.piket).forEach(d => D.piket[d] = D.piket[d].map(x => x === old ? v : x));
      save(); render();
    });
  }
  else if (a === 'dl') {
    const old = D[k][i];
    cfm(`Hapus "${esc(old)}"?`, () => {
      D[k].splice(i, 1);
      if (k === 'names') Object.keys(D.piket).forEach(d => D.piket[d] = D.piket[d].filter(x => x !== old));
      save(); render();
    });
  }
  else if (a === 'pk') { const d = el.dataset.d, n = el.dataset.n, l = D.piket[d] || []; D.piket[d] = l.includes(n) ? l.filter(x => x !== n) : [...l, n]; save(); el.classList.toggle('on'); }
  else if (a === 'da') { D.ann = D.ann.filter(x => x.id !== +el.dataset.id); save('Pengumuman dihapus'); render(); }
  else if (a === 'xls') xls();
  else if (a === 'pdf') pdf();
  else if (a === 'delkey') cfm('Hapus API Key?', async () => {
    try { await api('deleteKey', {}, {teacher:true}); D.hasKey = false; cacheCfg(); toast('API Key dihapus'); render(); }
    catch (x) { toast('Gagal menghapus key: ' + x.message); }
  });
  else if (a === 'test') {
    const r = $('#tr'); r.textContent = 'Menguji…';
    api('testKey', {key:$('#ak').value.trim()}, {teacher:true, timeout:CONFIG.CHAT_TIMEOUT_MS})
      .then(() => { r.textContent = '✅ Koneksi berhasil.'; })
      .catch(x => { r.textContent = '❌ Gagal terhubung (' + x.message + ').'; });
  }
});

/* Tombol siram (tahan) */
const press = e => { if (e.target.closest && e.target.closest('#sibtn')) { e.preventDefault(); startWater(); } };
document.addEventListener('pointerdown', press);
['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => document.addEventListener(ev, () => stopWater()));
document.addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && e.target.id === 'sibtn' && !e.repeat) { e.preventDefault(); startWater(); } });
document.addEventListener('keyup', e => { if (e.target.id === 'sibtn') stopWater(); });

document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.i === 'man') {
    S.mood.m = t.value; S.saved = false;
    const b = document.querySelector('[data-a=savej]');
    if (b && !S.saving) { b.disabled = false; b.textContent = 'Simpan Jurnal'; }
  } else if (t.dataset.i === 'q') {
    S.q = t.value; const l = $('#rlist'); if (l) l.innerHTML = rlist();
  }
});

document.addEventListener('change', e => {
  const t = e.target, c = t.dataset.c; if (!c) return;
  if (c === 'ros') { D.roster[t.dataset.d] = t.value; save('Roster tersimpan'); }
  else if (c === 'done') setLog(t.dataset.id, {done:t.checked});
  else if (c === 'urgsel') setLog(t.dataset.id, {urgency:t.value});
  else if (c === 'flt') { S.flt = t.value; render(); }
  else if (c === 'sort') { S.sort = t.value; render(); }
});

document.addEventListener('submit', e => {
  e.preventDefault(); const f = e.target.dataset.f;
  if (f === 'login') {
    const n = $('#sn').value, t = $('#st').value; if (!n || !t) return;
    S.haf = {for:'', st:'idle', row:null, err:''};
    S.me = {name:n, title:t}; wel = false; speak(`Assalamu alaikum ${n}, mari bercerita bareng Sobat Murid.`);
    S.mood = {w:null, g:null, m:''}; S.saved = false; S.logId = null; S.msgs = []; S.p = 0; go('dash');
  }
  else if (f === 'chat') send();
  else if (f === 'pw') checkPw();
  else if (f === 'ask') { const v = $('#modal input').value; const fn = cb; cb = null; modal(''); if (fn) fn(v); }
  else if (f === 'add') {
    const k = e.target.dataset.k, i = e.target.querySelector('input'), v = i.value.trim();
    if (!v) return; if (D[k].includes(v)) return toast('Data sudah ada.');
    D[k].push(v); save(); render();
  }
  else if (f === 'ann') {
    const v = $('#an').value.trim(); if (!v) return toast('Isi pengumuman dulu.');
    D.ann.push({id:Date.now(), t:Date.now(), x:v}); save('Pengumuman terbit'); render();
  }
  else if (f === 'key') {
    const k = $('#ak').value.trim(); if (!k) return toast('Isi API Key dulu.');
    api('saveKey', {key:k}, {teacher:true})
      .then(() => { D.hasKey = true; cacheCfg(); toast('API Key tersimpan'); render(); })
      .catch(x => toast('Gagal menyimpan key: ' + x.message));
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') modal(''); });
/* Kartu roster dapat dibuka lewat keyboard */
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.dataset && e.target.dataset.a === 'roster') { e.preventDefault(); openRoster(); } });

const firstGesture = e => { if (!wel || e.target.closest('[data-f=login]') || e.target.closest('.ov')) return; wel = false; speak('Selamat datang, Sobat Murid.'); };
document.addEventListener('pointerdown', e => { const b = e.target.closest('button'); if (b && b.id !== 'sibtn' && !b.disabled) tick(); firstGesture(e); });
document.addEventListener('keydown', e => { if (e.key === 'Tab') return; firstGesture(e); });

/* Logo gagal dimuat → sembunyikan agar tidak muncul ikon rusak */
document.addEventListener('error', e => { if (e.target.classList && e.target.classList.contains('app-logo')) e.target.classList.add('gone'); }, true);

boot();
setTimeout(() => { if (wel && S.view === 'login') speak('Selamat datang, Sobat Murid.'); }, 1200);
</script>
